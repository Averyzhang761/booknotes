<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>重置 Booknotes 缓存</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5ef;
        color: #202729;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
      }

      main {
        width: min(100% - 32px, 420px);
        display: grid;
        gap: 14px;
      }

      button,
      a {
        min-height: 44px;
        border: 0;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: #202729;
        color: white;
        text-decoration: none;
        font: inherit;
      }

      p {
        margin: 0;
        color: #687276;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>重置 Booknotes 缓存</h1>
      <p id="status">点击按钮会移除旧 service worker 和缓存，不会删除 Supabase 云端笔记。</p>
      <button type="button" id="reset">清缓存并重新打开</button>
      <a href="./index.html?v=20260803-4">直接打开新版</a>
    </main>
    <script>
      async function reset() {
        const status = document.querySelector("#status");
        status.textContent = "正在清理...";

        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }

        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }

        status.textContent = "已清理，正在打开新版...";
        location.href = "./index.html?v=20260803-4";
      }

      document.querySelector("#reset").addEventListener("click", reset);
    </script>
  </body>
</html>
